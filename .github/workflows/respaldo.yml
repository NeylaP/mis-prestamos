# Respaldo semanal de la base de datos en un repositorio PRIVADO aparte.
# Nunca guardes respaldos en este repositorio: es público.
# Requiere:
#   Secret  SUPABASE_DB_URL → cadena de conexión "Session pooler" (Supabase → Connect),
#                             con la contraseña de la base de datos incluida.
#   Secret  BACKUP_TOKEN    → token fine-grained de GitHub con permiso Contents: Read and write
#                             SOLO sobre el repositorio privado de respaldos.
#   Variable BACKUP_REPO    → usuario/nombre-del-repo-privado (ej.: neyla/mis-prestamos-respaldos)
name: Respaldo semanal

on:
  schedule:
    - cron: '0 8 * * 1'   # lunes 3:00 a. m. hora Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      - name: Volcar la base de datos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p salida
          # pg_dump debe ser de la misma versión mayor que el servidor de Supabase (o más nueva).
          docker run --rm -e DB postgres:17 sh -c 'pg_dump "$DB" --schema=public --no-owner --no-privileges' \
            | gzip > "salida/respaldo-$(date +%F).sql.gz"
          test "$(gzip -dc salida/*.gz | wc -c)" -gt 1000 || { echo "El respaldo salió vacío"; exit 1; }
      - name: Guardar en el repositorio privado
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
          REPO: ${{ vars.BACKUP_REPO }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" respaldos
          cp salida/*.gz respaldos/
          cd respaldos
          git config user.name "respaldo-automatico"
          git config user.email "respaldo@users.noreply.github.com"
          git add .
          git commit -m "Respaldo $(date +%F)"
          git push
