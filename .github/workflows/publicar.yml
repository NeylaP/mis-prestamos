# Compila, prueba y publica la app en GitHub Pages en cada push a main.
# Requiere en el repositorio (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL        → https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   → llave anon public (es pública; la seguridad la dan las políticas RLS)
# Si no están definidas, se usan los valores ya presentes en src/environments/environment.ts.
# Y en Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No cancelar un despliegue a medias: un run manual no debe tumbar uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probar el motor de cálculo
        run: npx ng test --watch=false
      - name: Configurar Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            # Reescribe URL/clave aunque el archivo tenga valores reales (no placeholders __…__).
            case "$SUPABASE_URL$SUPABASE_ANON_KEY" in
              *\|*|*"'"*) echo "SUPABASE_URL / SUPABASE_ANON_KEY no pueden contener | ni comillas simples"; exit 1 ;;
            esac
            sed -i -E \
              -e "s|(supabaseUrl: ')[^']*'|\1${SUPABASE_URL}'|" \
              -e "s|(supabaseAnonKey: ')[^']*'|\1${SUPABASE_ANON_KEY}'|" \
              src/environments/environment.ts
            grep -F "supabaseUrl: '${SUPABASE_URL}'" src/environments/environment.ts >/dev/null
            grep -F "supabaseAnonKey: '${SUPABASE_ANON_KEY}'" src/environments/environment.ts >/dev/null
            echo "Supabase configurado desde variables del repositorio."
          elif [ -z "$SUPABASE_URL" ] && [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Variables SUPABASE_URL y SUPABASE_ANON_KEY no definidas; se usan los valores de src/environments/environment.ts"
          else
            echo "Define ambas variables SUPABASE_URL y SUPABASE_ANON_KEY (o ninguna) en Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
      - name: Compilar
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Verificar salida del build
        run: |
          test -f dist/mis-prestamos/browser/index.html || {
            echo "No se generó dist/mis-prestamos/browser/index.html"
            find dist -type f | head -50
            exit 1
          }
      - name: Soporte para rutas de Angular (recargar sin error 404)
        run: cp dist/mis-prestamos/browser/index.html dist/mis-prestamos/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mis-prestamos/browser

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
