# Hace una consulta liviana cada 3 días para que el plan gratis de Supabase no pause el proyecto.
# Usa las mismas variables que el despliegue y llama a la función public.ping(), que no expone datos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}' && echo " · Supabase respondió"
