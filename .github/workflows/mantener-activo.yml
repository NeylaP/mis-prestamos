# Hace una consulta liviana cada 3 días para que el plan gratis de Supabase no pause el proyecto.
# Usa las mismas variables que el despliegue y llama a la función public.ping(), que no expone datos.
# Requiere (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL        → https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   → llave anon public
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          [ -n "$SUPABASE_URL" ] || { echo "Falta la variable SUPABASE_URL (Settings → Secrets and variables → Actions → Variables)."; missing=1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "Falta la variable SUPABASE_ANON_KEY."; missing=1; }
          exit "$missing"
      - name: Ping a Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' && echo " · Supabase respondió"
