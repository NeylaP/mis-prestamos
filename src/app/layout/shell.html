<header class="cab">
  <a class="marca" routerLink="/">
    <span class="logo">MP</span>
    <span class="nombre">Mis<br>Préstamos</span>
  </a>
  <div class="espacio"></div>
  <span class="usuario">{{ correo() }}</span>
  <button class="btn btn--chico" type="button" (click)="salir()">Salir</button>
</header>

<div class="cuerpo">
  <nav class="lateral" aria-label="Menú principal">
    @for (item of menu; track item.ruta) {
      <a [routerLink]="item.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: !!item.exacto }">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="item.icono" /></svg>
        {{ item.texto }}
      </a>
    }
  </nav>
  <main class="contenido">
    <router-outlet />
  </main>
</div>
